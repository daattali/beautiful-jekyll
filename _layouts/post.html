---
layout: base
---

<header class="page-header">
  <h1>{{ page.title }}</h1>
  {% if page.subtitle %}<p class="page-subtitle">{{ page.subtitle }}</p>{% endif %}
  <p class="page-meta">{{ page.date | date: site.date_format | default: "%B %-d, %Y" }}</p>
</header>

<article class="prose">
  {{ content }}
</article>
